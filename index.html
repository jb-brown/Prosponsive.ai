<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosponsive</title>
  <meta name="description" content="Prosponsive has wound down. It was fun to build, but other opportunities have come along.">
  <link rel="canonical" href="https://prosponsive.ai/">
  <meta property="og:title" content="Prosponsive">
  <meta property="og:description" content="Prosponsive has wound down. It was fun to build, but other opportunities have come along.">
  <meta property="og:url" content="https://prosponsive.ai/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://prosponsive.ai/assets/prosponsive-logo-icon.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Prosponsive">
  <meta name="twitter:description" content="Prosponsive has wound down. It was fun to build, but other opportunities have come along.">
  <link rel="icon" href="assets/prosponsive-logo-icon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <style>
    :root {
      --bg: #f4f6f4;
      --text-primary: #1f2321;
      --text-secondary: #5c635f;
      --accent: #2f4f3e;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161a18;
        --text-primary: #e8ece9;
        --text-secondary: #9aa39d;
        --accent: #7fae94;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }

    main {
      max-width: 34rem;
    }

    .wordmark {
      width: min(320px, 78vw);
      height: auto;
      margin: 0 auto 2.5rem;
      display: block;
    }

    /* The wordmark is a fixed green-fill SVG; knock it to white on dark. */
    @media (prefers-color-scheme: dark) {
      .wordmark {
        filter: brightness(0) invert(1);
      }
    }

    .message {
      font-size: clamp(1.25rem, 3.2vw, 1.6rem);
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
    }

    .sub {
      font-size: 1.0625rem;
      color: var(--text-secondary);
    }

    .rule {
      width: 3rem;
      height: 2px;
      background-color: var(--accent);
      border: 0;
      margin: 2.5rem auto;
      opacity: 0.6;
    }

    footer {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <main>
    <h1>
      <img src="assets/prosponsive-wordmark.svg" alt="Prosponsive" class="wordmark">
    </h1>

    <p class="message">It was fun to build, but other opportunities have come along.</p>
    <p class="sub">Thanks to everyone who tried it, broke it, and told us what they thought.</p>

    <hr class="rule">

    <footer>
      <p>&copy; 2026 Prosponsive, Inc.</p>
    </footer>
  </main>

</body>
</html>
