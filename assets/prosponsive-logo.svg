<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 0 220 260">
  <!--
    v7 — curled-tail P. Stem now ends at y=180 (down from y=240) and
    sweeps into a tail with outer radius 60 (matches bowl) and inner
    radius 42.04, ending at (-15, 220). Bowl + tail share curvature.
    The split-cut composition is unchanged: the section background
    (#e6eae7) shows in the right half of the sparkle so the sparkle
    reads as a notch out of the P; the left half stays transparent.
  -->
  <defs>
    <mask id="sparkle-cut">
      <rect x="-50" y="0" width="220" height="260" fill="white"/>
      <path fill="black" d="
        M 40 25
        C 40 55, 85 100, 115 100
        C 85 100, 40 145, 40 175
        C 40 145, -5 100, -35 100
        C -5 100, 40 55, 40 25
        Z
      "/>
    </mask>
    <clipPath id="right-of-line">
      <rect x="40" y="40" width="200" height="400"/>
    </clipPath>
  </defs>
  <path fill="#2f4f3e" mask="url(#sparkle-cut)" d="
    M 40 40
    L 90 40
    A 60 60 0 0 1 90 160
    L 90 180
    A 60 60 0 0 1 -15 220
    A 42.04 42.04 0 0 0 40 180
    Z
  "/>
  <path fill="#e6eae7" clip-path="url(#right-of-line)" d="
    M 40 25
    C 40 55, 85 100, 115 100
    C 85 100, 40 145, 40 175
    C 40 145, -5 100, -35 100
    C -5 100, 40 55, 40 25
    Z
  "/>
  <path fill="#4f6f5c" d="
    M 40 45
    C 40 67, 73 100, 95 100
    C 73 100, 40 133, 40 155
    C 40 133, 7 100, -15 100
    C 7 100, 40 67, 40 45
    Z
  "/>
</svg>
